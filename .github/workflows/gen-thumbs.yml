name: generate-thumbnails

# 推送文章或图片后自动生成封面缩略图并提交回仓库,
# 之后 GitHub Pages 原生构建会拿到缩略图重新部署。
# 由 GITHUB_TOKEN 推送的提交不会再次触发本工作流,无循环风险。
on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
      - "assets/images/**"
      - "tools/gen-image-meta.py"
      - ".github/workflows/gen-thumbs.yml"

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Generate thumbnails and image dims
        run: python tools/gen-image-meta.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: 自动生成封面缩略图 [skip ci]"
            git pull --rebase origin main
            git push
          fi
