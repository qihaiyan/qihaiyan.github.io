# Site
name: '海思'
title: '海思 · Java 后端技术博客'
description: '海思的技术博客，专注 Java 后端与 Spring 生态实战，原创文章涵盖 Spring Boot、Spring Cloud、Security/OAuth2、Redis、Kafka、Elasticsearch、Spring AI 等主题，每篇文章配套 GitHub 开源项目中的完整可运行示例代码。'
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
baseurl: ''
url: 'https://springcamp.cn'
email: 'haiyan_qi@hotmail.com'

include: ["_pages"]
permalink: /:title/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-redirect-from

feed:
  posts_limit: 100
  
authors:
    qihaiyan:
      name:           qihaiyan
      site:           https://springcamp.cn
      avatar:         assets/images/avatar1.jpg
      bio:            "业精于勤而荒于嬉，行成于思而毁于随"
      email:          haiyan_qi@hotmail.com
      github:         https://github.com/qihaiyan
 
# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      author: qihaiyan
      avatar: /assets/images/avatar1.jpg
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      
# Syntax
markdown: kramdown
highlighter: rouge

# Paginate
paginate: 10



# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [README.markdown, package.json, grunt.js, Gruntfile.js, Gruntfile.coffee, node_modules]
