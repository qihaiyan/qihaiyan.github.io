<!-- Cloudflare AI Search: 导航栏 AI 搜索框,替代原 lunr 关键词搜索 -->
<search-bar-snippet
    api-url="https://ai.springcamp.cn/"
    placeholder="AI 搜索本站…"
    max-results="8"
    max-render-results="8"
    show-url="true"
    show-date="true"
    theme="light">
</search-bar-snippet>

<style>
    /* 组件内部布局最小约 320px,压缩宽度会导致按钮溢出裁切,保持默认宽度 */
    #MagicMenu search-bar-snippet {
        display: block;
        --search-snippet-border-radius: .25rem;
    }
    /* 窄屏导航放不下,隐藏(与原 lunr 搜索框 hidden-sm-down 行为一致) */
    @media (max-width: 767.98px) {
        #MagicMenu search-bar-snippet { display: none; }
    }
</style>
